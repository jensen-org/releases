name: Distribution or hosting licence
description: Ask about rights the Jensen licence does not grant.
title: "[Licensing]: "
labels: [licensing]
body:
  - type: markdown
    attributes:
      value: |
        Using Jensen at work to build products you sell is already free and needs no licence request.
        Use this form only for rights the licence withholds: reselling Jensen, redistributing it,
        sublicensing it, bundling it into a product you ship, or offering it as a hosted service.
        Do not include confidential business information. The maintainer will provide a private
        contact path if needed.
  - type: dropdown
    id: right
    attributes:
      label: Which right do you need?
      options:
        - Resale or redistribution
        - Sublicensing
        - Hosted or managed service
        - Bundling Jensen into a product we ship
        - Something else
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended use
      description: Briefly describe what you want to do and at what scale.
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Organization
      description: Optional organization or product name.
